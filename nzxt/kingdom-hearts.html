<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<title>Kingdom Hearts · Station of Awakening · NZXT</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050914;color:#f9edcf;font-family:Georgia,"Times New Roman",serif}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;display:block;width:100vmin;height:100vmin;aspect-ratio:1;overflow:hidden;border-radius:50%;background:#060b20;isolation:isolate;box-shadow:inset 0 0 55px #000}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.rotor{transform-origin:320px 320px;animation:orbit 110s linear infinite}
.rotor.reverse{animation-direction:reverse;animation-duration:150s}
.pulse{animation:light 5s ease-in-out infinite}
.twinkle{animation:star 4s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes light{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes star{0%,100%{opacity:.35}50%{opacity:1}}
.vignette{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 51%,transparent 26%,rgba(0,0,0,.08) 54%,rgba(0,0,0,.48) 92%)}
.titleblock{position:absolute;left:0;top:10%;width:100%;text-align:center;text-shadow:0 2px 9px #050b1c,0 0 14px rgba(255,225,168,.7);pointer-events:none}
.eyebrow{font:600 clamp(5px,1.55vmin,12px)/1.4 Arial,sans-serif;letter-spacing:.31em;color:#e4cda0}
.toptitle{margin-top:.8vmin;font-size:clamp(12px,4.5vmin,34px);line-height:1.05;letter-spacing:.1em;font-variant:small-caps;color:#fff4d9}
.subtop{font:500 clamp(5px,1.1vmin,9px)/1.5 Arial,sans-serif;letter-spacing:.38em;color:#a8c8e5;margin-top:1vmin}
.centerline{position:absolute;left:0;right:0;top:58%;text-align:center;pointer-events:none}
.kh{font-size:clamp(13px,4.6vmin,36px);font-variant:small-caps;letter-spacing:.018em;font-weight:bold;color:#fff2d1;text-shadow:0 2px 2px #06071b,0 0 12px rgba(255,216,143,.95),0 0 28px rgba(39,153,228,.8)}
.kh2{font:600 clamp(5px,1.25vmin,10px)/1.4 Arial,sans-serif;letter-spacing:.42em;color:#c5dfef;margin-top:1vmin;text-shadow:0 1px 8px #000}
.stats{position:absolute;left:16%;right:16%;bottom:12%;display:grid;grid-template-columns:1fr 1fr;column-gap:7%;border-top:1px solid rgba(224,195,133,.48);padding-top:2.4vmin;text-align:center;pointer-events:none}
.metric .label{display:block;font:700 clamp(7px,1.65vmin,13px)/1.4 Arial,sans-serif;letter-spacing:.22em;color:#a5d5f1}
.metric .reading{font:normal clamp(17px,5.5vmin,43px)/1 Georgia,serif;color:#ffedc8;text-shadow:0 0 12px rgba(230,196,113,.75);font-variant-numeric:tabular-nums}
.metric .unit{font:400 clamp(7px,1.8vmin,14px) Arial,sans-serif;color:#b7a68a}
.corner{position:absolute;bottom:5.8%;left:0;right:0;text-align:center;font:600 clamp(4px,1vmin,8px) Arial,sans-serif;letter-spacing:.17em;color:#a4aec7;pointer-events:none}
body:not(.device) .stage{width:min(90vmin,640px);height:min(90vmin,640px)}
body:not(.device){background:radial-gradient(circle,#16223f,#050713 68%);padding:0}
@media (prefers-reduced-motion:reduce){.rotor,.pulse,.twinkle{animation:none}}
</style>
</head>

<div class="stats">
  <div class="metric"><span class="label">CPU</span><span class="reading" id="cpu">--</span><span class="unit">°C</span></div>
  <div class="metric"><span class="label">GPU</span><span class="reading" id="gpu">--</span><span class="unit">°C</span></div>
</div>
<div class="corner" id="status">AWAITING NZXT CAM</div>
</main>
<script>
(function(){
  const isKraken = new URLSearchParams(location.search).get("kraken") === "1";
  if(isKraken || (window.nzxt && window.nzxt.v1)) document.body.classList.add("device");
  function render(data){
    const c = data && Array.isArray(data.cpus) ? data.cpus.find(x=>Number.isFinite(x.temperature)) : null;
    const g = data && Array.isArray(data.gpus) ? data.gpus.find(x=>Number.isFinite(x.temperature)) : null;
    document.getElementById("cpu").textContent = c ? Math.round(c.temperature) : "--";
    document.getElementById("gpu").textContent = g ? Math.round(g.temperature) : "--";
    document.getElementById("status").textContent = "THE HEART REMEMBERS";
  }
  window.nzxt = window.nzxt || {};
  window.nzxt.v1 = window.nzxt.v1 || {};
  window.nzxt.v1.onMonitoringDataUpdate = render;
})();
</script>
